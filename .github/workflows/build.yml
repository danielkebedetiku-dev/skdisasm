name: Build Sonic 3K ROM

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert Eggman Sprites
        run: |
          pip install pillow
          python convert_eggman.py

      - name: Hook Eggman Code
        run: |
          $code = Get-Content "sonic3k.asm" -Raw
          $code = $code -replace "Sonic_InstaShield:", "Sonic_InstaShield:`r`n`t`tjmp`tEggman_Jetpack_Start"
          $code = $code -replace "Sonic_JumpHeight:", "Sonic_JumpHeight:`r`n`t`tbsr.w`tEggman_Jetpack_Fly`r`n`t`tbsr.w`tEggman_Route_Update`r`n`t`tbsr.w`tEggman_Route_DarkPalette"
          $code = $code -replace "Sonic_Animate:", "Sonic_Animate:`r`n`t`tjmp`tEggman_Route_Frame"
          $code = $code -replace "ArtUnc_Sonic:", "ArtUnc_Sonic:`r`n`t`tincbin `"eggman_bin/art_eggman.bin`"`r`nArtUnc_Sonic_Unused:"
          $code = $code -replace "Map_Sonic:", "Map_Sonic:`r`n`t`tinclude `"eggman_bin/eggman_tables.asm`"`r`nMap_Sonic_Unused:"
          $code = $code -replace "DPLC_Sonic:", "DPLC_Sonic:`r`n`t`tbra.w`tDPLC_Eggman`r`nDPLC_Sonic_Unused:"
          $code = $code -replace "Pal_Sonic:", "Pal_Sonic:`r`n`t`tincbin `"eggman_bin/pal_eggman.bin`"`r`nPal_Sonic_Unused:"
          $code = $code -replace "(?m)^END\s*$", "include `"routern.asm`"`r`ninclude `"eggman_route.asm`"`r`ninclude `"Eggman.asm`"`r`nEND"
          Set-Content "sonic3k.asm" $code -NoNewline

      - name: Build ROM
        run: |
          cmd /c "echo. | buildS3Complete.bat"
          if (!(Test-Path "*.bin")) { exit 1 }

      - name: Upload built ROM
        uses: actions/upload-artifact@v4
        with:
          name: sonic3k-rom
          path: "*.bin
