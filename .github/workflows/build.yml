name: Build Sonic 3K ROM

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hook Eggman Code
        run: |
          $code = Get-Content "sonic3k.asm" -Raw
          $code = $code -replace "Sonic_InstaShield:", "Sonic_InstaShield:`r`n`t`tjmp`tEggman_Jetpack_Start"
          $code = $code -replace "Sonic_JumpHeight:", "Sonic_JumpHeight:`r`n`t`tbsr.w`tEggman_Jetpack_Fly"
          $code = $code -replace "(?m)^END\s*$", "include `"eggman.asm`"`r`nEND"
          Set-Content "sonic3k.asm" $code -NoNewline

      - name: Build ROM
        run: cmd /c "echo. | buildS3Complete.bat"

      - name: Upload built ROM
        uses: actions/upload-artifact@v4
        with:
          name: sonic3k-rom
          path: "*.bin"
