name: Build Sonic 3K ROM

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          if (Test-Path "build.lua") { .\build_tools\Lua\lua.exe build.lua }
          elseif (Test-Path "buildS3K.bat") { cmd /c "echo. | buildS3K.bat" }
          else { Get-ChildItem -Filter "*build*" }

      - name: Upload built ROM
        uses: actions/upload-artifact@v4
        with:
          name: sonic3k-rom
          path: "*.bin"
