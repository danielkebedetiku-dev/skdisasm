name: Slice Eggman Sprites

on:
  push:
    paths:
      - 'slice.py'
      - 'Eggman.jpg'
      - '.github/workflows/slice.yml'

jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python slice.py
      - uses: actions/upload-artifact@v4
        with:
          name: eggman-sprites
          path: sprites/*.png
